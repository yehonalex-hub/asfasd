<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>נגן סרטון</title>

  <style>
    body{
      margin:0;
      background:#111;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      font-family:Arial;
    }

    .video-box{
      width:80%;
      max-width:900px;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 0 25px rgba(0,0,0,0.5);
    }


    video{
      width:100%;
      display:block;
    }
  </style>
</head>
<body>

  <div class="video-box">
    <!-- החלף את movie.mp4 בשם הסרטון שלך -->
    <video controls autoplay muted>
      <source src="movie.mp4" type="video/mp4">
      הדפדפן שלך לא תומך בסרטונים.
    </video>
  </div>

</body>
</html>
